<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wplace · Region Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root {
  --bg:      #07090f;
  --surface: #0d1117;
  --raised:  #131920;
  --border:  #1e2433;
  --accent:  #7c6ff7;
  --cyan:    #22d3ee;
  --text:    #e8eaf0;
  --muted:   #4a5568;
  --dim:     #2d3748;
  --font:    'Space Grotesk', system-ui, sans-serif;
  --mono:    'JetBrains Mono', monospace;
  --sw:      304px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
#app { display: flex; height: 100vh; }

/* ── Sidebar ─────────────────────────────────────────────── */
aside {
  width: var(--sw); min-width: var(--sw);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden; z-index: 500;
}

#s-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#s-head h1 { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--muted); letter-spacing: .3px; }
#s-head h1 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 7px var(--accent); flex-shrink: 0; }
#big-num { font-family: var(--mono); font-size: 28px; font-weight: 600; letter-spacing: -1px; margin-top: 8px; line-height: 1; color: var(--text); }
#big-num.idle { color: var(--dim); }
#big-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.9px; margin-top: 3px; }

/* Load state */
#load-bar {
  margin: 10px 12px 0; padding: 8px 11px; border-radius: 7px;
  background: var(--raised); border: 1px solid var(--border);
  display: flex; align-items: center; gap: 9px; flex-shrink: 0;
}
#load-bar.done { display: none; }
#load-bar .spin { width: 13px; height: 13px; border: 1.5px solid var(--dim); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
#load-msg { font-size: 11px; color: var(--muted); }

/* Stats */
#stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 12px 0; flex-shrink: 0; }
.sc { background: var(--raised); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; }
.sc .sl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
.sc .sv { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--cyan); margin-top: 3px; }

/* Search */
#searchbox { padding: 10px 12px 3px; flex-shrink: 0; position: relative; }
#search-icon { position: absolute; left: 21px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#searchinput {
  width: 100%; background: var(--raised); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 9px 5px 27px;
  font-family: var(--font); font-size: 12px; color: var(--text);
  outline: none; transition: border-color .15s;
}
#searchinput:focus { border-color: var(--accent); }
#searchinput::placeholder { color: var(--muted); }
#srcount { font-size: 10px; color: var(--dim); padding: 3px 12px; flex-shrink: 0; min-height: 17px; }

/* Scroll area */
#lscroll { flex: 1; position: relative; overflow: hidden; }
#lr-panel {
  position: absolute; inset: 0; overflow-y: auto;
}
#lr-panel::-webkit-scrollbar { width: 3px; }
#lr-panel::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

/* List items — fixed 34px height for virtual scroll */
.li {
  display: flex; align-items: center; gap: 5px;
  padding: 0 10px 0 12px; height: 34px; flex-shrink: 0;
  border-bottom: 1px solid #0a0d13; transition: background .1s;
}
.li:hover { background: var(--raised); }
.lrank { font-family: var(--mono); font-size: 9px; color: var(--dim); width: 18px; text-align: right; flex-shrink: 0; }
.lid   { font-family: var(--mono); font-size: 9px; color: var(--muted); width: 40px; text-align: right; flex-shrink: 0; }
.lname { font-size: 11px; color: #9aa3b5; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbar-w { width: 28px; flex-shrink: 0; }
.lbar { height: 2px; background: var(--accent); border-radius: 1px; opacity: 0.55; }
.lval { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 40px; text-align: right; flex-shrink: 0; white-space: nowrap; }
.lgo {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 4px;
  border: 1px solid var(--border); background: transparent;
  color: var(--dim); cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  transition: all .1s;
}
.lgo:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }

/* ── Map ─────────────────────────────────────────────────── */
#mwrap { flex: 1; position: relative; background: var(--bg); }
#map { width: 100%; height: 100%; background: var(--bg); }
#minfo-pill {
  position: absolute; top: 14px; right: 14px; z-index: 400;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 11px;
}

/* Loading overlay on map */
#mload {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 300; display: flex; align-items: center; gap: 10px;
  background: color-mix(in srgb, var(--surface) 95%, transparent);
  border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px;
}
#mload.done { display: none; }
#mload .spin { width: 18px; height: 18px; border: 2px solid var(--dim); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
#mload span { font-size: 13px; color: var(--muted); }

@keyframes spin { to { transform: rotate(360deg); } }

/* Popup */
.leaflet-popup-content-wrapper { background: var(--surface) !important; border: 1px solid var(--border) !important; border-radius: 10px !important; box-shadow: 0 12px 40px rgba(0,0,0,.7) !important; padding: 0 !important; }
.leaflet-popup-tip-container { display: none; }
.leaflet-popup-content { margin: 0 !important; }
.pu { padding: 12px 14px; min-width: 160px; }
.pu-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
.pu-row { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.pu-row b { color: #94a3b8; font-weight: 500; }
.pu-link { display: inline-block; margin-top: 8px; background: var(--accent); color: #fff; padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: 500; text-decoration: none; }
.pu-link:hover { opacity: .85; }

/* Override Leaflet zoom controls */
.leaflet-control-zoom a { background: var(--surface) !important; border-color: var(--border) !important; color: var(--muted) !important; }
.leaflet-control-zoom a:hover { background: var(--raised) !important; color: var(--text) !important; }
</style>
</head>
<body>
<div id="app">

<aside>
  <div id="s-head">
    <h1><span class="dot"></span>Wplace Leaderboard</h1>
    <div id="big-num" class="idle">—</div>
    <div id="big-label">total pixels painted</div>
  </div>

  <div id="load-bar">
    <div class="spin"></div>
    <span id="load-msg">Fetching leaderboard…</span>
  </div>

  <div id="stats">
    <div class="sc"><div class="sl">Regions</div><div class="sv" id="s-reg">—</div></div>
    <div class="sc"><div class="sl">Top region</div><div class="sv" id="s-max">—</div></div>
  </div>

  <div id="searchbox">
    <svg id="search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="searchinput" type="text" placeholder="Search name or region ID…" oninput="onSearch(this.value)">
  </div>
  <div id="srcount"></div>

  <div id="lscroll">
    <div id="lr-panel"></div>
  </div>
</aside>

<div id="mwrap">
  <div id="map"></div>
  <div id="minfo-pill">— regions</div>
  <div id="mload"><div class="spin"></div><span id="mload-msg">Loading…</span></div>
</div>

</div>
<script>
// ── Hardcoded source ──────────────────────────────────────────────────────────
const CSV_URL = 'https://raw.githubusercontent.com/WhyNotShiny/WplaceRanking/main/region_leaderboard.csv';

// ── Map setup ─────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false, center: [25, 10], zoom: 2 });
L.control.zoom({ position: 'bottomright' }).addTo(map);

// Base tile layer (no labels — our filled overlay sits on top)
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// Labels-only layer rendered above the filled overlay
map.createPane('labelsPane');
map.getPane('labelsPane').style.zIndex = '320';
map.getPane('labelsPane').style.pointerEvents = 'none';
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19, pane: 'labelsPane'
}).addTo(map);

// ── Gradient (returns [r,g,b] — fast, no string parsing) ──────────────────────
const STOPS = [
  [0.00, [26,  5, 64]],
  [0.20, [91, 33,182]],
  [0.45, [124,111,247]],
  [0.65, [ 34,211,238]],
  [0.85, [245,158, 11]],
  [1.00, [255, 45,111]],
];
function gradRGB(t) {
  for (let i = 1; i < STOPS.length; i++) {
    const [t0,c0] = STOPS[i-1], [t1,c1] = STOPS[i];
    if (t <= t1) {
      const f = (t-t0)/(t1-t0);
      return [c0[0]+f*(c1[0]-c0[0])|0, c0[1]+f*(c1[1]-c0[1])|0, c0[2]+f*(c1[2]-c0[2])|0];
    }
  }
  return [255,45,111];
}

// ── Region coordinates ────────────────────────────────────────────────────────
function regionCoords(rid) {
  const x = (rid-1) % 512, y = (rid-1)/512|0;
  const lng = ((x+0.5)/512)*360 - 180;
  const n   = Math.PI - 2*Math.PI*(y+0.5)/512;
  const lat = (180/Math.PI) * Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
  return [lat, lng];
}

// ── Format ────────────────────────────────────────────────────────────────────
const fmt = n => n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toLocaleString();

function animCount(el, to) {
  const s = Date.now(), d = 800;
  const tick = () => {
    const p = Math.min((Date.now()-s)/d,1), e = 1-Math.pow(1-p,3);
    el.textContent = fmt(Math.round(to*e));
    if (p<1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ── Filled overlay layer ──────────────────────────────────────────────────────
// Builds a 512×512 ImageData (one pixel = one wplace region) then renders each
// frame with a single ctx.drawImage call — O(1) per frame, no per-point loops.
//
// The wplace 512×512 grid is uniform in Web Mercator space, so it maps
// perfectly onto Leaflet's tile coordinate system via latLngToContainerPoint.

const WORLD_LAT  =  85.0511287798066;   // Leaflet / Web Mercator north limit
const WORLD_LAT2 = -85.0511287798066;

const FilledLayer = L.Layer.extend({
  onAdd(map) {
    this._c = document.createElement('canvas');
    this._c.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;z-index:260;';
    map.getContainer().appendChild(this._c);
    this._resize();
    map.on('resize',                         this._resize, this);
    map.on('move zoom moveend zoomend viewreset', this._draw,  this);
    this._draw();
  },
  onRemove(map) {
    this._c.remove();
    map.off('resize move zoom moveend zoomend viewreset', null, this);
  },
  setOffscreen(os) { this._os = os; if (this._c) this._draw(); },
  _resize() {
    const s = this._map.getSize();
    this._c.width = s.x; this._c.height = s.y;
    this._draw();
  },
  _draw() {
    if (!this._os) return;
    const ctx = this._c.getContext('2d');
    const W = this._c.width, H = this._c.height;
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;

    // Find where the wplace world corners land on screen.
    // latLngToContainerPoint accounts for zoom, pan, AND CSS-transform pan.
    const tl = this._map.latLngToContainerPoint([WORLD_LAT,  -180]);
    const br = this._map.latLngToContainerPoint([WORLD_LAT2,  180]);
    const dw = br.x - tl.x, dh = br.y - tl.y;
    if (dw <= 0 || dh <= 0) return;

    // Draw once for the main world, plus one repeat each side for low-zoom wrapping
    for (let rep = -1; rep <= 1; rep++) {
      const x = tl.x + rep * dw;
      if (x + dw < 0 || x > W) continue;           // outside viewport, skip
      ctx.drawImage(this._os, 0, 0, 512, 512, x, tl.y, dw, dh);
    }
  }
});

// Build the 512×512 offscreen bitmap from CSV rows — called once after data loads
function buildOffscreen(rows, maxPx) {
  const os  = document.createElement('canvas');
  os.width = os.height = 512;
  const ctx = os.getContext('2d');
  const img = ctx.createImageData(512, 512);
  const d   = img.data;

  // Base colour for tiles not present in the CSV (dark, slightly lighter than bg)
  for (let i = 0; i < 512*512*4; i += 4) {
    d[i]=18; d[i+1]=23; d[i+2]=34; d[i+3]=255;
  }

  const logMax = Math.log1p(maxPx) || 1;

  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    const x = (row.regionId-1) % 512;
    const y = (row.regionId-1) / 512 | 0;
    if (x < 0 || x > 511 || y < 0 || y > 511) continue;
    const t    = Math.log1p(row.pixels) / logMax;
    const [cr,cg,cb] = gradRGB(t);
    const idx  = (y*512 + x) * 4;
    d[idx]=cr; d[idx+1]=cg; d[idx+2]=cb; d[idx+3]=220;   // slight transparency for labels to bleed through
  }

  ctx.putImageData(img, 0, 0);
  return os;
}

// ── Virtual List — renders only ~30 DOM nodes regardless of dataset size ──────
class VirtualList {
  constructor(container, itemH=34) {
    this._el = container; this._ih = itemH;
    this._all=[]; this._rows=[]; this._mx=1; this._key=null;

    const spacer=document.createElement('div');
    spacer.style.cssText='position:relative;width:100%;';
    const inner=document.createElement('div');
    inner.style.cssText='position:absolute;top:0;left:0;right:0;';
    spacer.appendChild(inner);
    container.appendChild(spacer);
    this._sp=spacer; this._in=inner;

    container.addEventListener('scroll', ()=>this._paint(), {passive:true});
    if (typeof ResizeObserver!=='undefined')
      new ResizeObserver(()=>{this._key=null;this._paint();}).observe(container);
  }

  load(rows, maxPx) {
    this._all=rows; this._mx=maxPx||1;
    this._el.scrollTop=0; this._key=null;
    this.filter('');
  }

  filter(q) {
    const s=q.trim().toLowerCase();
    this._rows = s
      ? this._all.filter(r=>r.name.toLowerCase().includes(s)||String(r.regionId).includes(s))
      : this._all;
    this._el.scrollTop=0; this._key=null;
    this._paint();
    const n=this._rows.length, tot=this._all.length;
    const el=document.getElementById('srcount');
    if (el) el.textContent = n<tot
      ? `${n.toLocaleString()} of ${tot.toLocaleString()} match`
      : `${n.toLocaleString()} regions`;
  }

  _paint() {
    const {_el:el,_ih:ih,_sp:sp,_in:inn,_rows:rows,_mx:mx}=this;
    const n=rows.length;
    sp.style.height=`${n*ih}px`;
    const viewH=el.clientHeight||400, top=el.scrollTop;
    const start=Math.max(0,Math.floor(top/ih)-10);
    const end=Math.min(n,start+Math.ceil(viewH/ih)+15);
    const key=`${start}:${end}:${n}`;
    if (key===this._key) return;
    this._key=key;
    inn.style.transform=`translateY(${start*ih}px)`;
    const frag=document.createDocumentFragment();
    for (let i=start;i<end;i++) {
      const r=rows[i];
      const div=document.createElement('div');
      div.className='li';
      const pct=mx>0?(r.pixels/mx*100).toFixed(1):0;
      div.innerHTML=
        `<span class="lrank">${r.rank}</span>`+
        `<span class="lid">#${r.regionId}</span>`+
        `<span class="lname" title="${r.name}">${r.name}</span>`+
        `<div class="lbar-w"><div class="lbar" style="width:${pct}%"></div></div>`+
        `<span class="lval">${fmt(r.pixels)}</span>`+
        `<button class="lgo" title="Fly to region">↗</button>`;
      const cap=r;
      div.querySelector('.lgo').addEventListener('click',e=>{e.stopPropagation();flyTo(cap);});
      frag.appendChild(div);
    }
    inn.replaceChildren(frag);
  }
}

let vlist=null;
function getVlist() {
  if (!vlist) vlist=new VirtualList(document.getElementById('lr-panel'));
  return vlist;
}
function onSearch(val) { getVlist().filter(val); }

// ── State ─────────────────────────────────────────────────────────────────────
let filledLayer = null;
let rowsData    = [];

// ── Auto-load from GitHub ─────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('mload').classList.remove('done');
  fetch(CSV_URL)
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      document.getElementById('load-msg').textContent  = 'Parsing…';
      document.getElementById('mload-msg').textContent = 'Parsing…';
      return r.text();
    })
    .then(text => {
      const {data} = Papa.parse(text, {header:true, skipEmptyLines:true});
      ingestCSV(data);
    })
    .catch(err => {
      const msg = `Error: ${err.message}`;
      document.getElementById('load-msg').textContent   = msg;
      document.getElementById('mload-msg').textContent  = msg;
      document.getElementById('load-bar').style.background =
        'color-mix(in srgb,#f87171 12%,var(--raised))';
    });
});

// ── Ingest parsed CSV ─────────────────────────────────────────────────────────
function ingestCSV(data) {
  const rows = data
    .filter(r => r.regionId)
    .map(r => ({
      rank:     +r.rank     || 0,
      regionId: +r.regionId,
      name:     r.name      || `Region #${r.regionId}`,
      pixels:   +r.pixels   || 0,
      url:      r.url       || ''
    }));

  // Pre-cache coords on each row for the click handler
  for (const r of rows) r._ll = regionCoords(r.regionId);

  rowsData = rows;
  render(rows);

  document.getElementById('load-bar').classList.add('done');
  document.getElementById('mload').classList.add('done');
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(rows) {
  const totalPx = rows.reduce((s,r)=>s+r.pixels, 0);
  const maxPx   = rows.reduce((m,r)=>Math.max(m,r.pixels), 0);

  // Stats
  const numEl = document.getElementById('big-num');
  numEl.classList.remove('idle');
  animCount(numEl, totalPx);
  document.getElementById('s-reg').textContent = rows.length.toLocaleString();
  document.getElementById('s-max').textContent = fmt(maxPx);
  document.getElementById('minfo-pill').textContent = `${rows.length.toLocaleString()} regions`;

  // Build offscreen bitmap and attach to layer — O(n) once, O(1) per frame after
  const os = buildOffscreen(rows, maxPx);
  if (filledLayer) map.removeLayer(filledLayer);
  filledLayer = new FilledLayer();
  filledLayer.addTo(map);
  filledLayer.setOffscreen(os);

  // Virtual sidebar list
  document.getElementById('searchinput').value = '';
  getVlist().load(rows, maxPx);
}

// ── flyTo ─────────────────────────────────────────────────────────────────────
function flyTo(r) {
  map.flyTo(r._ll, 10, {duration:1.1});
  L.popup({maxWidth:230}).setLatLng(r._ll).setContent(`
    <div class="pu">
      <div class="pu-name">${r.name}</div>
      <div class="pu-row"><b>Region ID</b> ${r.regionId}</div>
      <div class="pu-row"><b>Rank</b> #${r.rank}</div>
      <div class="pu-row"><b>Pixels</b> ${r.pixels.toLocaleString()}</div>
      ${r.url?`<a class="pu-link" href="${r.url}" target="_blank">Open in wplace ↗</a>`:''}
    </div>`).openOn(map);
}

// ── Map click — find nearest visible region ───────────────────────────────────
map.on('click', e => {
  if (!rowsData.length) return;
  const cp = e.containerPoint;
  const b  = map.getBounds();
  const sw = b.getSouthWest(), ne = b.getNorthEast();
  let best=null, bestD=Infinity;

  for (const r of rowsData) {
    const ll=r._ll;
    if (ll[0]<sw.lat||ll[0]>ne.lat) continue;
    let lng=ll[1];
    if (ne.lng>180){if(lng<0)lng+=360;}
    else if(sw.lng<-180){if(lng>0)lng-=360;}
    if (lng<sw.lng||lng>ne.lng) continue;
    const pt=map.latLngToContainerPoint(r._ll);
    const d=(pt.x-cp.x)**2+(pt.y-cp.y)**2;
    if (d<bestD){bestD=d;best=r;}
  }
  if (best && bestD < 600) flyTo(best);
});
