# .github/workflows/weekly-snapshot.yml
#
# Replaces .github/workflows/snapshot.yml (same job, new filename) — the old
# file's `schedule:` trigger never fired a single time in over a week despite
# every documented cause being ruled out (valid YAML, correct cron, main
# confirmed as the default branch, not a fork, not disabled, no 60-day
# inactivity, no duplicate workflow file, and a real re-push that still
# didn't register). That points to a stuck registration on GitHub's side
# tied to this specific file path. A genuinely new path is the next thing
# to try before escalating to GitHub Support.
#
# Delete the old snapshot.yml when adding this one.

name: Build leaderboard snapshot

on:
  schedule:
    # Shifted off the exact hour (was 03:00) — GitHub's own docs note that
    # round-hour schedules are the most congested and most likely to be
    # delayed, since that's when everyone else's cron jobs fire too.
    - cron: '17 1 * * 6'   # Saturdays, 01:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the new CSV + manifest back to the repo

# Prevents a manual run and the schedule from ever overlapping — without
# this, two runs racing the same git history is exactly what caused the
# "fetch first" push rejection seen earlier. cancel-in-progress: false
# means an overlapping trigger queues behind the current run instead of
# killing 2 hours of in-progress scraping.
concurrency:
  group: leaderboard-snapshot
  cancel-in-progress: false

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5h ceiling — comfortable margin over the ~2h real runtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run builder
        run: dotnet run --project . -- --auto < /dev/null
        # < /dev/null makes stdin empty+redirected even under `dotnet run`,
        # which is what --auto detects — belt-and-suspenders with the flag.

      - name: Upload snapshot as artifact (safety net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-snapshot-${{ github.run_id }}
          path: |
            Leaderboard_files/*.csv
            Leaderboard_files/manifest.json
          retention-days: 7

      - name: Commit new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Leaderboard_files/*.csv Leaderboard_files/manifest.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add leaderboard snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push